<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cup and Ball Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #instructions {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #666666;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 20;
        }

        #message.success {
            color: #4caf50;
        }

        #message.error {
            color: #666666;
        }

        .firework {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="instructions">Watch carefully...</div>
    <div id="message"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game state
        let gameState = 'intro';
        let ballUnderCup = 0;
        let canClick = false;
        let shuffleTime = 0;
        const shuffleDuration = 5;
        let shuffleSpeed = 1;
        let cupPositions = [-3, 0, 3];
        let swappingCups = { a: -1, b: -1, progress: 0, startPosA: 0, startPosB: 0 };
        let lastSwapTime = 0;

        // Three.js scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f0);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 10;
        directionalLight.shadow.camera.bottom = -10;
        scene.add(directionalLight);

        // Create table
        const tableGeometry = new THREE.BoxGeometry(15, 0.3, 8);
        const tableMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.9
        });
        const table = new THREE.Mesh(tableGeometry, tableMaterial);
        table.position.y = -0.15;
        table.receiveShadow = true;
        scene.add(table);

        // Create ball
        const ballGeometry = new THREE.SphereGeometry(0.35, 32, 32);
        const ballMaterial = new THREE.MeshStandardMaterial({
            color: 0xff6b6b,
            roughness: 0.3
        });
        const ball = new THREE.Mesh(ballGeometry, ballMaterial);
        ball.position.y = 0.35;
        ball.castShadow = true;
        ball.visible = false;
        scene.add(ball);

        // Create cups
        const cups = [];
        const cupMaterial = new THREE.MeshStandardMaterial({
            color: 0xe0e0e0,
            roughness: 0.7,
            side: THREE.DoubleSide
        });

        function createCup(xPos) {
            const cupGroup = new THREE.Group();

            // Cup body (inverted cone)
            const bodyGeometry = new THREE.CylinderGeometry(0.6, 1.0, 1.5, 32);
            const body = new THREE.Mesh(bodyGeometry, cupMaterial);
            body.castShadow = true;
            cupGroup.add(body);

            // Cup bottom (disc)
            const bottomGeometry = new THREE.CircleGeometry(1.0, 32);
            const bottom = new THREE.Mesh(bottomGeometry, cupMaterial);
            bottom.rotation.x = -Math.PI / 2;
            bottom.position.y = -0.75;
            bottom.castShadow = true;
            cupGroup.add(bottom);

            // Cup rim (torus)
            const rimGeometry = new THREE.TorusGeometry(0.6, 0.04, 16, 100);
            const rim = new THREE.Mesh(rimGeometry, cupMaterial);
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 0.75;
            rim.castShadow = true;
            cupGroup.add(rim);

            cupGroup.position.set(xPos, 0.75, 0);
            scene.add(cupGroup);
            return cupGroup;
        }

        cups.push(createCup(-3));
        cups.push(createCup(0));
        cups.push(createCup(3));

        // UI elements
        const instructionsEl = document.getElementById('instructions');
        const messageEl = document.getElementById('message');

        // Clock for animation
        const clock = new THREE.Clock();

        // Raycaster for click detection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Start game function
        function startGame() {
            gameState = 'intro';
            canClick = false;
            shuffleTime = 0;
            shuffleSpeed = 1;
            lastSwapTime = 0;
            swappingCups = { a: -1, b: -1, progress: 0, startPosA: 0, startPosB: 0 };

            // Reset cup positions
            cupPositions = [-3, 0, 3];
            cups.forEach((cup, i) => {
                cup.position.x = cupPositions[i];
                cup.position.y = 0.75;
            });

            // Randomly select ball position
            ballUnderCup = Math.floor(Math.random() * 3);
            ball.position.x = cupPositions[ballUnderCup];
            ball.position.y = 0.35;
            ball.visible = true;

            // Display instructions
            instructionsEl.textContent = 'Watch carefully...';
            messageEl.style.opacity = '0';
            messageEl.className = '';

            // Lift cup to show ball
            setTimeout(() => {
                cups[ballUnderCup].position.y = 2;
            }, 1000);

            // Lower cup
            setTimeout(() => {
                cups[ballUnderCup].position.y = 0.75;
            }, 2500);

            // Hide ball and start shuffling
            setTimeout(() => {
                ball.visible = false;
                gameState = 'shuffling';
                instructionsEl.textContent = '';
            }, 3000);
        }

        // Shuffling algorithm
        function shuffleCups(deltaTime) {
            shuffleTime += deltaTime;

            // Calculate speed multiplier (1 to 4)
            shuffleSpeed = 1 + (shuffleTime / shuffleDuration) * 3;

            const swapInterval = 0.8 / shuffleSpeed;

            // Check if we need to start a new swap
            if (swappingCups.a === -1 && shuffleTime - lastSwapTime >= swapInterval) {
                // Select two random different cups
                let a = Math.floor(Math.random() * 3);
                let b = Math.floor(Math.random() * 3);
                while (b === a) {
                    b = Math.floor(Math.random() * 3);
                }

                swappingCups.a = a;
                swappingCups.b = b;
                swappingCups.progress = 0;
                swappingCups.startPosA = cupPositions[a];
                swappingCups.startPosB = cupPositions[b];
                lastSwapTime = shuffleTime;

                // Update ball position if needed
                if (ballUnderCup === a) {
                    ballUnderCup = b;
                } else if (ballUnderCup === b) {
                    ballUnderCup = a;
                }
            }

            // Animate ongoing swap
            if (swappingCups.a !== -1) {
                swappingCups.progress += deltaTime * shuffleSpeed / 0.8;

                if (swappingCups.progress >= 1) {
                    // Swap complete
                    swappingCups.progress = 1;

                    // Update positions array
                    const temp = cupPositions[swappingCups.a];
                    cupPositions[swappingCups.a] = cupPositions[swappingCups.b];
                    cupPositions[swappingCups.b] = temp;

                    // Set final positions
                    cups[swappingCups.a].position.x = cupPositions[swappingCups.a];
                    cups[swappingCups.a].position.y = 0.75;
                    cups[swappingCups.b].position.x = cupPositions[swappingCups.b];
                    cups[swappingCups.b].position.y = 0.75;

                    // Reset swap
                    swappingCups.a = -1;
                    swappingCups.b = -1;
                } else {
                    // Ease-in-out interpolation
                    let t = swappingCups.progress;
                    let easedT;
                    if (t < 0.5) {
                        easedT = 2 * t * t;
                    } else {
                        easedT = 1 - Math.pow(-2 * t + 2, 2) / 2;
                    }

                    // Linear X interpolation
                    cups[swappingCups.a].position.x = swappingCups.startPosA +
                        (swappingCups.startPosB - swappingCups.startPosA) * easedT;
                    cups[swappingCups.b].position.x = swappingCups.startPosB +
                        (swappingCups.startPosA - swappingCups.startPosB) * easedT;

                    // Arc Y motion
                    const arc = Math.sin(swappingCups.progress * Math.PI) * 0.5;
                    cups[swappingCups.a].position.y = 0.75 + arc;
                    cups[swappingCups.b].position.y = 0.75 + arc;
                }
            }

            // Check if shuffling is complete
            if (shuffleTime >= shuffleDuration) {
                gameState = 'waiting';
                canClick = true;
                instructionsEl.textContent = 'Click a cup!';

                // Ensure final positions are exact
                cups.forEach((cup, i) => {
                    cup.position.x = cupPositions[i];
                    cup.position.y = 0.75;
                });
            }
        }

        // Click handler
        function onMouseClick(event) {
            if (!canClick) return;

            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update raycaster
            raycaster.setFromCamera(mouse, camera);

            // Check for intersections with all cup children
            const allCupMeshes = [];
            cups.forEach(cup => {
                cup.children.forEach(child => {
                    allCupMeshes.push({ mesh: child, cup: cup });
                });
            });

            const intersects = raycaster.intersectObjects(allCupMeshes.map(obj => obj.mesh));

            if (intersects.length > 0) {
                // Find which cup was clicked
                let clickedCupIndex = -1;
                for (let i = 0; i < cups.length; i++) {
                    for (let j = 0; j < intersects.length; j++) {
                        if (cups[i].children.includes(intersects[j].object)) {
                            clickedCupIndex = i;
                            break;
                        }
                    }
                    if (clickedCupIndex !== -1) break;
                }

                if (clickedCupIndex !== -1) {
                    canClick = false;
                    gameState = 'revealing';

                    // Lift clicked cup
                    cups[clickedCupIndex].position.y = 2;
                    ball.position.x = cups[clickedCupIndex].position.x;

                    setTimeout(() => {
                        if (clickedCupIndex === ballUnderCup) {
                            // Correct guess!
                            ball.visible = true;
                            gameState = 'celebrating';
                            messageEl.textContent = '✓';
                            messageEl.className = 'success';
                            messageEl.style.opacity = '1';
                            instructionsEl.textContent = '';

                            // Launch fireworks
                            launchFireworks();

                            // Start new game after 3 seconds
                            setTimeout(() => {
                                messageEl.style.opacity = '0';
                                setTimeout(startGame, 500);
                            }, 3000);
                        } else {
                            // Wrong guess
                            gameState = 'sorry';
                            messageEl.textContent = 'SORRY';
                            messageEl.className = 'error';
                            messageEl.style.opacity = '1';
                            instructionsEl.textContent = '';

                            setTimeout(() => {
                                // Show correct cup
                                cups[ballUnderCup].position.y = 2;
                                ball.position.x = cups[ballUnderCup].position.x;
                                ball.visible = true;

                                setTimeout(() => {
                                    messageEl.style.opacity = '0';
                                    setTimeout(startGame, 500);
                                }, 2500);
                            }, 1500);
                        }
                    }, 800);
                }
            }
        }

        // Fireworks system
        function launchFireworks() {
            const colors = ['#4caf50', '#2196F3', '#ff9800', '#9c27b0', '#f44336'];
            let burstCount = 0;

            function createBurst() {
                if (burstCount >= 6) return;
                burstCount++;

                const color = colors[Math.floor(Math.random() * colors.length)];
                const x = Math.random() * window.innerWidth;
                const y = window.innerHeight * 0.6;

                createFirework(x, y, color);

                if (burstCount < 6) {
                    setTimeout(createBurst, 400);
                }
            }

            createBurst();
        }

        function createFirework(x, y, color) {
            const particles = [];
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 2 + Math.random() * 2.5;

                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = color;
                document.body.appendChild(particle);

                particles.push({
                    element: particle,
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * velocity,
                    vy: Math.sin(angle) * velocity,
                    life: 50,
                    maxLife: 50
                });
            }

            animateFirework(particles);
        }

        function animateFirework(particles) {
            let frame = 0;
            const gravity = 0.1;

            function animate() {
                frame++;
                let allDead = true;

                particles.forEach(p => {
                    if (p.life > 0) {
                        allDead = false;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += gravity;
                        p.life--;

                        const opacity = p.life / p.maxLife;
                        p.element.style.left = p.x + 'px';
                        p.element.style.top = p.y + 'px';
                        p.element.style.opacity = opacity;
                    }
                });

                if (!allDead && frame < 60) {
                    requestAnimationFrame(animate);
                } else {
                    // Remove all particles
                    particles.forEach(p => {
                        if (p.element.parentNode) {
                            p.element.parentNode.removeChild(p.element);
                        }
                    });
                }
            }

            animate();
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            if (gameState === 'shuffling') {
                shuffleCups(deltaTime);
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Event listeners
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('click', onMouseClick);

        // Start the game
        startGame();
        animate();
    </script>
</body>
</html>
